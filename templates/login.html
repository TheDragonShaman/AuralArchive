<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AuralArchive</title>
    <script>
        (function() {
            try {
                var savedTheme = localStorage.getItem('theme');
                if (savedTheme) {
                    document.documentElement.setAttribute('data-theme', savedTheme);
                }
            } catch (err) {
                console.warn('Theme preload failed:', err);
            }
        })();
    </script>
    
    <!-- DaisyUI from CDN (includes light and dark themes) -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- DaisyUI Docs Typeface (Outfit) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Custom Theme Definitions -->
    <style>
        [data-theme="dark"] {
            color-scheme: dark;
            --color-base-100: oklch(28% 0.045 255);
            --color-base-200: oklch(23% 0.04 255);
            --color-base-300: oklch(18% 0.035 255);
            --color-base-content: oklch(92% 0.012 255);
            --color-primary: oklch(58% 0.18 276);
            --color-primary-content: oklch(97% 0.024 276);
            --color-secondary: oklch(63% 0.12 181);
            --color-secondary-content: oklch(96% 0.015 181);
            --color-accent: oklch(64% 0.14 163);
            --color-accent-content: oklch(96% 0.012 163);
            --color-neutral: oklch(32% 0.03 255);
            --color-neutral-content: oklch(90% 0.01 255);
            --color-info: oklch(72% 0.12 231);
            --color-info-content: oklch(97% 0.015 231);
            --color-success: oklch(70% 0.14 152);
            --color-success-content: oklch(97% 0.02 152);
            --color-warning: oklch(78% 0.21 82);
            --color-warning-content: oklch(98% 0.025 82);
            --color-error: oklch(66% 0.24 24);
            --color-error-content: oklch(97% 0.02 24);
            --b1: var(--color-base-100);
            --b2: var(--color-base-200);
            --b3: var(--color-base-300);
            --bc: var(--color-base-content);
            --p: var(--color-primary);
            --pc: var(--color-primary-content);
            --s: var(--color-secondary);
            --sc: var(--color-secondary-content);
            --a: var(--color-accent);
            --ac: var(--color-accent-content);
            --n: var(--color-neutral);
            --nc: var(--color-neutral-content);
            --in: var(--color-info);
            --inc: var(--color-info-content);
            --su: var(--color-success);
            --suc: var(--color-success-content);
            --wa: var(--color-warning);
            --wac: var(--color-warning-content);
            --er: var(--color-error);
            --erc: var(--color-error-content);
            --rounded-box: 0.25rem;
            --rounded-btn: 0.25rem;
            --rounded-badge: 0.25rem;
        }

        [data-theme="light"] {
            color-scheme: light;
            --color-base-100: oklch(100% 0 0);

            --color-base-300: oklch(95% 0 0);
            --color-base-content: oklch(21% 0.006 285.885);

            --color-primary-content: oklch(93% 0.034 272.788);
            --color-secondary: oklch(65% 0.241 354.308);
            --color-secondary-content: oklch(94% 0.028 342.258);
            --color-accent: oklch(77% 0.152 181.912);
            --color-accent-content: oklch(38% 0.063 188.416);
            --color-neutral: oklch(14% 0.005 285.823);
            --color-neutral-content: oklch(92% 0.004 286.32);
            --color-info: oklch(74% 0.16 232.661);
            --color-info-content: oklch(29% 0.066 243.157);
            --color-success: oklch(76% 0.177 163.223);
            --color-success-content: oklch(37% 0.077 168.94);
            --color-warning: oklch(82% 0.189 84.429);
            --color-warning-content: oklch(41% 0.112 45.904);
            --color-error: oklch(71% 0.194 13.428);

            --b1: var(--color-base-100);
            --b2: var(--color-base-200);
            --b3: var(--color-base-300);
            --bc: var(--color-base-content);
            --p: var(--color-primary);
            --pc: var(--color-primary-content);
            --s: var(--color-secondary);
            --sc: var(--color-secondary-content);
            --a: var(--color-accent);
            --ac: var(--color-accent-content);
            --n: var(--color-neutral);
            --nc: var(--color-neutral-content);
            --in: var(--color-info);
            --inc: var(--color-info-content);
            --su: var(--color-success);
            --suc: var(--color-success-content);
            --wa: var(--color-warning);
            --wac: var(--color-warning-content);
            --er: var(--color-error);

        [data-theme="nord"] {

            --color-base-100: oklch(95.127% 0.007 260.731);
            --color-base-200: oklch(93.299% 0.01 261.788);
            --color-base-300: oklch(89.925% 0.016 262.749);
            --color-base-content: oklch(32.437% 0.022 264.182);
            --p: 59.435% 0.077 254.027;
            --pc: 11.887% 0.015 254.027;
            --s: 69.651% 0.059 248.687;
            --sc: 13.93% 0.011 248.687;
            --a: 77.464% 0.062 217.469;
            --ac: 15.492% 0.012 217.469;
            --n: 45.229% 0.035 264.131;

            --b2: var(--color-base-200);

            --inc: 13.841% 0.012 332.664;
            --su: 76.827% 0.074 131.063;

            --wac: 17.097% 0.017 84.093;
            --er: 60.61% 0.12 15.341;
            --erc: 12.122% 0.024 15.341;

            --rounded-btn: 1rem;

        [data-theme="blueberry"] {
            color-scheme: dark;
            --color-base-100: oklch(29% 0.066 243.157);
            --color-base-200: oklch(39% 0.09 240.876);
            --color-base-300: oklch(44% 0.11 240.79);
            --color-base-content: oklch(95% 0.026 236.824);
            --color-primary: oklch(68% 0.169 237.323);
            --color-primary-content: oklch(100% 0 0);
            --color-secondary: oklch(62% 0.214 259.815);
            --color-secondary-content: oklch(98% 0.026 102.212);
            --color-accent: oklch(68% 0.169 237.323);
            --color-accent-content: oklch(98% 0.003 247.858);
            --color-neutral: oklch(44% 0.11 240.79);
            --color-neutral-content: oklch(97% 0.013 236.62);

            --color-info-content: oklch(97% 0.013 236.62);
            --color-success: oklch(69% 0.17 162.48);
            --color-success-content: oklch(97% 0.021 166.113);
            --color-warning: oklch(76% 0.188 70.08);
            --color-warning-content: oklch(98% 0.022 95.277);
            --color-error: oklch(63% 0.237 25.331);
            --color-error-content: oklch(97% 0.013 17.38);
            --b1: var(--color-base-100);
            --b2: var(--color-base-200);
            --b3: var(--color-base-300);
            --bc: var(--color-base-content);
            --p: var(--color-primary);
            --pc: var(--color-primary-content);
            --s: var(--color-secondary);
            --sc: var(--color-secondary-content);
            --a: var(--color-accent);
            --ac: var(--color-accent-content);
            --n: var(--color-neutral);
            --nc: var(--color-neutral-content);
            --in: var(--color-info);
            --inc: var(--color-info-content);
            --su: var(--color-success);
            --suc: var(--color-success-content);
            --wa: var(--color-warning);
            --wac: var(--color-warning-content);
            --er: var(--color-error);
            --erc: var(--color-error-content);
            --rounded-box: 0.25rem;
            --rounded-btn: 0.25rem;
            --rounded-badge: 0.25rem;
        }

        body { font-family: 'Outfit', system-ui, -apple-system, sans-serif; }
        .logo-gradient {
            background: linear-gradient(135deg, var(--color-primary), var(--color-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 bg-base-200">
    <div class="w-full max-w-sm">
        <div class="card bg-base-100 shadow-2xl">
            <div class="card-body gap-5">

                <!-- Logo -->
                <div class="text-center mb-1">
                    <h1 class="text-5xl font-bold tracking-tight logo-gradient">AuralArchive</h1>
                    <p class="text-sm text-base-content/60 mt-1">Sign in to continue</p>
                </div>

                <!-- Error Message -->
                {% if error %}
                <div role="alert" class="alert alert-error">
                    <i class="fas fa-circle-xmark shrink-0"></i>
                    <span>{{ error }}</span>
                </div>
                {% endif %}

                <!-- Success Message -->
                {% if success %}
                <div role="alert" class="alert alert-success">
                    <i class="fas fa-circle-check shrink-0"></i>
                    <span>{{ success }}</span>
                </div>
                {% endif %}

                <!-- Login Form -->
                <form method="POST" action="{{ url_for('auth.login') }}" class="space-y-4">
                    <fieldset class="fieldset gap-1">
                        <legend class="fieldset-legend text-xs uppercase tracking-wide">Username</legend>
                        <label class="input input-bordered w-full">
                            <i class="fas fa-user opacity-50 text-sm"></i>
                            <input type="text" name="username" placeholder="Enter username"
                                   required autocomplete="username" autofocus
                                   value="{{ username or '' }}" />
                        </label>
                    </fieldset>

                    <fieldset class="fieldset gap-1">
                        <legend class="fieldset-legend text-xs uppercase tracking-wide">Password</legend>
                        <label class="input input-bordered w-full">
                            <i class="fas fa-lock opacity-50 text-sm"></i>
                            <input type="password" name="password" placeholder="Enter password"
                                   required autocomplete="current-password" />
                        </label>
                    </fieldset>

                    <label class="label cursor-pointer justify-start gap-3">
                        <input type="checkbox" name="remember" class="checkbox checkbox-sm checkbox-primary"
                               id="remember" {% if remember %}checked{% endif %} />
                        <span class="label-text">Remember me for 30 days</span>
                    </label>

                    <button type="submit" class="btn btn-primary w-full">
                        <i class="fas fa-right-to-bracket"></i>
                        Sign In
                    </button>
                </form>

                <div class="divider my-0"></div>
                <p class="text-center text-xs text-base-content/50 flex items-center justify-center gap-2">
                    <i class="fas fa-lock text-[10px]"></i>
                    Secure login with encrypted password
                </p>

            </div>
        </div>
    </div>
</body>
</html>
